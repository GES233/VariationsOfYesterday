# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup gradle (validates the wrapper and caches the distribution)
        uses: gradle/actions/setup-gradle@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: explain contract drift
        if: failure()
        run: |
          ./gradlew test --tests "*SliceContractSpec*" -Dvoy.contract.write=true --console=plain || true
          echo '--- contracts/mandate-slice-v1.json diff on this runner ---'
          git --no-pager diff -- contracts/mandate-slice-v1.json || true
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/