name: voy_world

on:
  push:
    paths:
      - "tools/voy_world/**"
      - ".github/workflows/voy_world.yml"
  pull_request:
    paths:
      - "tools/voy_world/**"
      - ".github/workflows/voy_world.yml"

jobs:
  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/voy_world
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests (includes the content pack equivalence check)
        run: mix test

      - name: Lint the content pack
        run: mix voy.content lint
