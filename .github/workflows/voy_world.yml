name: voy_world

on:
  push:
    paths:
      - "tools/voy_world/**"
      - ".github/workflows/voy_world.yml"
  pull_request:
    paths:
      - "tools/voy_world/**"
      - ".github/workflows/voy_world.yml"

jobs:
  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/voy_world
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install Hex/Rebar and fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test
