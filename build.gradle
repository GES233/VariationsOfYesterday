plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'scala'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Main"
		url = uri("https://maven.kotori316.com")
		content {
			includeVersion("com.kotori316", "scalable-cats-force-fabric", project.slp_version)
			includeVersion("org.typelevel", "cats-core_3", project.cats_version)
			includeVersion("org.typelevel", "cats-kernel_3", project.cats_version)
			includeVersion("org.typelevel", "cats-free_3", project.cats_version)
		}
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"variations-of-yesterday" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

// The mixins reference Scala classes (MandateEconomy), so Java must compile
// jointly with Scala instead of in the earlier standalone compileJava pass.
// Point the (now source-less) java output at the scala output too, or loom's
// run classpath references a build/classes/java/main directory that is never
// created and the game launch warns about it.
sourceSets {
	main {
		java.srcDirs = []
		scala.srcDirs = ['src/main/scala', 'src/main/java']
		java.destinationDirectory = scala.destinationDirectory
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "com.kotori316:scalable-cats-force-fabric:${kotori_scala_version}:dev"

	// Scala Support
	implementation "org.scala-lang:scala3-library_3:${project.scala_version}"
	implementation "org.typelevel:cats-core_3:${project.cats_version}"
	implementation "org.typelevel:cats-kernel_3:${project.cats_version}"

	// Test
	testImplementation "org.scala-lang:scala3-library_3:${project.scala_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(ScalaCompile).configureEach {
	scalaCompileOptions.with {
		force = true
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// Code is MPL-2.0; narrative prose and assets are CC BY-NC-SA 4.0. Both
	// notices ship inside the jar so a redistributed build always carries them.
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
	from("LICENSE-CONTENT") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Test
test {
	useJUnitPlatform()
	// Deliberate, reviewed regeneration of the numeric snapshot
	// (`contracts/mandate-slice-v1.json`): an ordinary test run verifies the
	// checked-in file byte for byte and fails if the measurement moved.
	systemProperty "voy.contract.write", System.getProperty("voy.contract.write", "false")
	// A failing contract assertion must show what moved, not just where it
	// failed; the default exception format swallows the message.
	testLogging {
		exceptionFormat = "full"
	}
	// Opt-in lattice benchmark (GridBenchmarkSpec) needs headroom for
	// ~1.2M cells; normal test runs keep the default heap.
	if (System.getenv("VOY_BENCH")) {
		maxHeapSize = "3g"
		testLogging { showStandardStreams = true }
	}
}

// Loom's remapJar consumes the mixin-map output of compileTestScala without
// declaring it, which fails Gradle's implicit-dependency validation once
// src/test actually has sources. Declare it explicitly.
tasks.named("remapJar") {
	dependsOn tasks.named("compileTestScala")
}